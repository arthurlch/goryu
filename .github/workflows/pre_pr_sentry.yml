name: Branch freshness

# Tests, lint and vet live in ci.yml. This guard only checks that the PR branch
# has caught up with main, so merges stay linear and conflict-free.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  up-to-date:
    name: Up to date with main
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch contains latest main
        run: |
          set -e
          base="${{ github.base_ref }}"
          git fetch origin "$base"
          merge_base=$(git merge-base "origin/$base" HEAD)
          base_head=$(git rev-parse "origin/$base")
          if [ "$merge_base" = "$base_head" ]; then
            echo "Branch is up to date with $base."
          else
            echo "Branch is behind $base. Rebase or merge origin/$base and push again."
            exit 1
          fi
